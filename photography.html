<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>光影叙事 - 摄影作品展示</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* CSS变量 */
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --bg-card: rgba(255, 255, 255, 0.05);
            --bg-card-hover: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-muted: #666666;
            --accent: #3b82f6;
            --accent-light: #60a5fa;
            --accent-dark: #2563eb;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.1);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.4);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 重置样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Noto Sans SC', 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 页面加载动画 */
        .page-loading {
            opacity: 0;
            animation: fadeInPage 0.8s ease-out forwards;
        }

        @keyframes fadeInPage {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* 顶部导航栏 */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            padding: 1.5rem 0;
            transition: var(--transition);
        }

        .navbar.scrolled {
            padding: 1rem 0;
            background: rgba(10, 10, 10, 0.95);
        }

        .nav-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .nav-subtitle {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 300;
            letter-spacing: 0.2em;
        }

        /* 主内容区 */
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 8rem 2rem 4rem;
        }

        /* 风格筛选标签 */
        .style-filter {
            margin-bottom: 3rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: center;
            opacity: 0;
            transform: translateY(20px);
            transition: var(--transition-slow);
        }

        .style-filter.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .style-tag {
            padding: 0.625rem 1.5rem;
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            background: var(--glass-bg);
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 400;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .style-tag::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            opacity: 0;
            transition: var(--transition);
            z-index: -1;
        }

        .style-tag:hover {
            transform: scale(1.05);
            border-color: var(--accent);
            color: var(--text-primary);
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.2);
        }

        .style-tag.active {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            border-color: transparent;
            color: var(--text-primary);
            font-weight: 500;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
        }

        .style-tag.active::before {
            opacity: 1;
        }

        /* 作品网格 */
        .works-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            min-height: 400px;
        }

        @media (max-width: 1200px) {
            .works-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .works-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }
        }

        @media (max-width: 480px) {
            .works-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
        }

        /* 作品卡片 */
        .work-card {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            cursor: pointer;
            opacity: 0;
            transform: translateY(40px);
            transition: var(--transition);
            aspect-ratio: 4/5;
        }

        .work-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .work-card.hidden {
            opacity: 0;
            transform: scale(0.8);
            pointer-events: none;
            position: absolute;
            visibility: hidden;
        }

        .work-card.show {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
            position: relative;
            visibility: visible;
        }

        .work-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent);
            box-shadow: var(--shadow-lg), 0 0 40px rgba(59, 130, 246, 0.1);
        }

        .work-card:hover .work-image {
            transform: scale(1.05);
        }

        .work-card:hover .work-overlay {
            opacity: 1;
        }

        .work-image-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .work-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .work-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                to top,
                rgba(0, 0, 0, 0.9) 0%,
                rgba(0, 0, 0, 0.6) 40%,
                rgba(0, 0, 0, 0.2) 100%
            );
            opacity: 0;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 1.5rem;
        }

        .work-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            transform: translateY(20px);
            opacity: 0;
            transition: var(--transition);
        }

        .work-card:hover .work-title {
            transform: translateY(0);
            opacity: 1;
        }

        .work-photographer {
            font-size: 0.875rem;
            color: var(--text-secondary);
            transform: translateY(20px);
            opacity: 0;
            transition: var(--transition);
            transition-delay: 0.05s;
        }

        .work-card:hover .work-photographer {
            transform: translateY(0);
            opacity: 1;
        }

        .work-style-tag {
            position: absolute;
            top: 1rem;
            right: 1rem;
            padding: 0.375rem 0.875rem;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            font-size: 0.75rem;
            color: var(--text-primary);
            opacity: 0;
            transform: translateY(-10px);
            transition: var(--transition);
        }

        .work-card:hover .work-style-tag {
            opacity: 1;
            transform: translateY(0);
        }

        /* 无匹配提示 */
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
            font-size: 1.125rem;
            opacity: 0;
            transform: translateY(20px);
            transition: var(--transition-slow);
        }

        .no-results.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* 模态窗 - 扩散动效版本 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .modal.active {
            display: flex;
        }

        .modal-backdrop {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            opacity: 0;
            transition: var(--transition);
        }

        .modal.active .modal-backdrop {
            opacity: 1;
        }

        .modal-content {
            position: relative;
            z-index: 1001;
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            transform: scale(0.9) translateY(20px);
            transition: var(--transition-slow);
        }

        .modal.active .modal-content {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        /* 扩散动画元素 */
        .spread-element {
            position: fixed;
            z-index: 1002;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .spread-element.spreading {
            opacity: 0;
            transform: scale(1.5);
        }

        /* 滑动进入动画 */
        .modal-content.slide-in {
            animation: slideInFromRight 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .modal-content.slide-out {
            animation: slideOutToRight 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes slideInFromRight {
            0% {
                opacity: 0;
                transform: translateX(100%);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideOutToRight {
            0% {
                opacity: 1;
                transform: translateX(0);
            }
            100% {
                opacity: 0;
                transform: translateX(100%);
            }
        }

        .modal-content::-webkit-scrollbar {
            width: 6px;
        }

        .modal-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .modal-content::-webkit-scrollbar-thumb {
            background: var(--glass-border);
            border-radius: 3px;
        }

        .modal-content::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        .modal-close {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            width: 40px;
            height: 40px;
            border: none;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            color: var(--text-primary);
            font-size: 1.25rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .modal-close:hover {
            background: var(--accent);
            transform: scale(1.1);
        }

        .modal-header {
            padding: 3rem 2rem 2rem;
            text-align: center;
            border-bottom: 1px solid var(--glass-border);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease 0.3s;
        }

        .modal.active .modal-header {
            opacity: 1;
            transform: translateY(0);
        }

        .photographer-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent);
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.3);
            transform: scale(0.8);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1) 0.4s;
        }

        .modal.active .photographer-avatar {
            transform: scale(1);
        }

        .photographer-name {
            font-size: 2rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.5s ease 0.5s;
        }

        .modal.active .photographer-name {
            opacity: 1;
            transform: translateY(0);
        }

        .photographer-bio {
            font-size: 1rem;
            color: var(--text-secondary);
            line-height: 1.8;
            max-width: 600px;
            margin: 0 auto;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.5s ease 0.6s;
        }

        .modal.active .photographer-bio {
            opacity: 1;
            transform: translateY(0);
        }

        .modal-body {
            padding: 2rem;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s ease 0.7s;
        }

        .modal.active .modal-body {
            opacity: 1;
            transform: translateY(0);
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: var(--accent);
            border-radius: 2px;
        }

        .philosophy {
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: 2rem;
            font-style: italic;
            padding-left: 1rem;
            border-left: 2px solid var(--glass-border);
        }

        .other-works-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
        }

        .other-work-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition);
            opacity: 0;
            transform: scale(0.9);
        }

        .modal.active .other-work-item {
            opacity: 1;
            transform: scale(1);
        }

        .other-work-item:nth-child(1) { transition-delay: 0.8s; }
        .other-work-item:nth-child(2) { transition-delay: 0.9s; }
        .other-work-item:nth-child(3) { transition-delay: 1.0s; }
        .other-work-item:nth-child(4) { transition-delay: 1.1s; }

        .other-work-item:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .other-work-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }

        .other-work-item:hover .other-work-image {
            transform: scale(1.1);
        }

        .other-work-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .other-work-item:hover .other-work-overlay {
            opacity: 1;
        }

        .other-work-title {
            color: var(--text-primary);
            font-size: 0.875rem;
            font-weight: 500;
            text-align: center;
            padding: 0.5rem;
        }

        /* 脚注 */
        .footer {
            margin-top: 4rem;
            padding: 2rem 0;
            border-top: 1px solid var(--glass-border);
            text-align: center;
        }

        .footer-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .footer-text {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
        }

        .social-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 1.25rem;
            transition: var(--transition);
        }

        .social-link:hover {
            color: var(--accent);
            transform: translateY(-2px);
        }

        /* 滚动触发动画类 */
        .scroll-reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: var(--transition-slow);
        }

        .scroll-reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            .main-content {
                padding: 6rem 1rem 3rem;
            }

            .nav-content {
                padding: 0 1rem;
            }

            .nav-title {
                font-size: 1.25rem;
            }

            .nav-subtitle {
                display: none;
            }

            .style-filter {
                gap: 0.5rem;
            }

            .style-tag {
                padding: 0.5rem 1rem;
                font-size: 0.8rem;
            }

            .modal {
                padding: 1rem;
            }

            .modal-content {
                max-height: 95vh;
            }

            .modal-header {
                padding: 2rem 1.5rem 1.5rem;
            }

            .modal-body {
                padding: 1.5rem;
            }

            .photographer-avatar {
                width: 100px;
                height: 100px;
            }

            .photographer-name {
                font-size: 1.5rem;
            }

            .other-works-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .other-works-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body class="page-loading">
    <!-- 顶部导航栏 -->
    <nav class="navbar" id="navbar">
        <div class="nav-content">
            <div>
                <h1 class="nav-title">光影叙事</h1>
                <p class="nav-subtitle">Visual Stories Through Light</p>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="main-content">
        <!-- 风格筛选标签 -->
        <div class="style-filter scroll-reveal" id="styleFilter">
            <button class="style-tag active" data-style="all">全部</button>
            <button class="style-tag" data-style="人像">人像</button>
            <button class="style-tag" data-style="风光">风光</button>
            <button class="style-tag" data-style="街拍">街拍</button>
            <button class="style-tag" data-style="黑白">黑白</button>
        </div>

        <!-- 作品网格 -->
        <div class="works-grid" id="worksGrid">
            <!-- 作品卡片将通过JS动态生成 -->
        </div>

        <!-- 无匹配提示 -->
        <div class="no-results" id="noResults" style="display: none;">
            <p>暂无匹配的作品，请尝试其他风格标签</p>
        </div>
    </main>

    <!-- 模态窗 -->
    <div class="modal" id="modal">
        <div class="modal-backdrop" id="modalBackdrop"></div>
        <div class="modal-content" id="modalContent">
            <button class="modal-close" id="modalClose">✕</button>
            <div class="modal-header">
                <img class="photographer-avatar" id="modalAvatar" src="" alt="">
                <h2 class="photographer-name" id="modalName"></h2>
                <p class="photographer-bio" id="modalBio"></p>
            </div>
            <div class="modal-body">
                <h3 class="section-title">摄影理念</h3>
                <p class="philosophy" id="modalPhilosophy"></p>
                
                <h3 class="section-title">代表作品</h3>
                <div class="other-works-grid" id="otherWorksGrid">

                </div>
            </div>
        </div>
    </div>

    <!-- 脚注 -->
    <footer class="footer">
        <div class="footer-content">
            <p class="footer-text">© 2024 光影叙事. All rights reserved.</p>
            <div class="social-links">
                <a href="#" class="social-link" title="Instagram">📷</a>
                <a href="#" class="social-link" title="Twitter">🐦</a>
                <a href="#" class="social-link" title="Website">🌐</a>
            </div>
        </div>
    </footer>

    <script>
        // ==================== 数据定义 ====================
        
        // 摄影师数据
        const photographers = [
            {
                id: 1,
                name: "Anna Lee",
                avatar: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=200&h=200&fit=crop",
                bio: "Anna Lee 是一位专注于人像摄影的艺术家，擅长捕捉人物最真实的情感瞬间。她相信每一张照片都应该讲述一个故事，通过光线和构图传达内心的情感波动。",
                philosophy: "摄影是光与影的对话，是瞬间与永恒的交织。我追求的不仅是完美的构图，更是能够触动心灵的真实情感。每一次快门，都是一次与被摄者灵魂的交流。"
            },
            {
                id: 2,
                name: "Mark Chen",
                avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200&h=200&fit=crop",
                bio: "Mark Chen 是一位热爱自然的风光摄影师，他的镜头下展现了大自然最壮丽的一面。从高山到大海，从日出到星空，他用影像记录着地球最动人的风景。",
                philosophy: "大自然是最伟大的艺术家，我只是有幸记录下它的杰作。每一片云彩、每一束光线都在诉说着千年的故事，我的使命是将这些瞬间定格为永恒。"
            },
            {
                id: 3,
                name: "Elena Rossi",
                avatar: "https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=200&h=200&fit=crop",
                bio: "Elena Rossi 是一位城市光影诗人，她善于在喧嚣的都市中寻找被忽视的美。街拍对她而言，是观察生活、理解人性的独特视角。",
                philosophy: "街头是城市的舞台，每个人都是主角。我寻找的是那些转瞬即逝的真实瞬间——一个眼神、一个微笑、一个背影，这些平凡中的不平凡，构成了城市最动人的诗篇。"
            }
        ];

        // 作品数据
        const works = [
            {
                id: 1,
                title: "情绪的回声",
                photographerId: 1,
                style: "人像",
                image: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600&h=750&fit=crop"
            },
            {
                id: 2,
                title: "山峦之巅",
                photographerId: 2,
                style: "风光",
                image: "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&h=750&fit=crop"
            },
            {
                id: 3,
                title: "都市黄昏",
                photographerId: 3,
                style: "街拍",
                image: "https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=600&h=750&fit=crop"
            },
            {
                id: 4,
                title: "光影交织",
                photographerId: 1,
                style: "黑白",
                image: "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=600&h=750&fit=crop"
            },
            {
                id: 5,
                title: "星河万里",
                photographerId: 2,
                style: "风光",
                image: "https://images.unsplash.com/photo-1419242902214-272b3f66ee7a?w=600&h=750&fit=crop"
            },
            {
                id: 6,
                title: "雨中漫步",
                photographerId: 3,
                style: "街拍",
                image: "https://images.unsplash.com/photo-1428592953211-077101b2021b?w=600&h=750&fit=crop"
            },
            {
                id: 7,
                title: "凝视",
                photographerId: 1,
                style: "人像",
                image: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=600&h=750&fit=crop"
            },
            {
                id: 8,
                title: "晨曦破晓",
                photographerId: 2,
                style: "风光",
                image: "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=600&h=750&fit=crop"
            }
        ];

        // ==================== DOM元素 ====================
        const styleFilter = document.getElementById('styleFilter');
        const worksGrid = document.getElementById('worksGrid');
        const noResults = document.getElementById('noResults');
        const modal = document.getElementById('modal');
        const modalBackdrop = document.getElementById('modalBackdrop');
        const modalContent = document.getElementById('modalContent');
        const modalClose = document.getElementById('modalClose');
        const modalAvatar = document.getElementById('modalAvatar');
        const modalName = document.getElementById('modalName');
        const modalBio = document.getElementById('modalBio');
        const modalPhilosophy = document.getElementById('modalPhilosophy');
        const otherWorksGrid = document.getElementById('otherWorksGrid');
        const navbar = document.getElementById('navbar');

        // ==================== 状态变量 ====================
        let currentStyle = 'all';
        let currentPhotographerId = null;
        let spreadElement = null;
        let isAnimating = false;

        // ==================== 初始化 ====================
        
        // 渲染作品卡片
        function renderWorks() {
            worksGrid.innerHTML = '';
            
            works.forEach((work, index) => {
                const photographer = photographers.find(p => p.id === work.photographerId);
                const card = document.createElement('div');
                card.className = 'work-card scroll-reveal';
                card.dataset.style = work.style;
                card.dataset.photographerId = work.photographerId;
                card.dataset.workId = work.id;
                card.style.transitionDelay = `${index * 0.1}s`;
                
                card.innerHTML = `
                    <div class="work-image-container">
                        <img class="work-image" src="${work.image}" alt="${work.title}" loading="lazy">
                        <div class="work-overlay">
                            <h3 class="work-title">${work.title}</h3>
                            <p class="work-photographer">${photographer.name}</p>
                        </div>
                        <span class="work-style-tag">${work.style}</span>
                    </div>
                `;
                
                card.addEventListener('click', (e) => openModalWithSpread(e, work.photographerId, work));
                worksGrid.appendChild(card);
            });

            // 触发滚动动画
            setTimeout(() => {
                observeElements();
            }, 100);
        }

        // 筛选作品
        function filterWorks(style) {
            currentStyle = style;
            const cards = document.querySelectorAll('.work-card');
            let visibleCount = 0;

            cards.forEach(card => {
                const cardStyle = card.dataset.style;
                const shouldShow = style === 'all' || cardStyle === style;

                if (shouldShow) {
                    card.classList.remove('hidden');
                    card.classList.add('show');
                    visibleCount++;
                } else {
                    card.classList.remove('show');
                    card.classList.add('hidden');
                }
            });

            // 显示/隐藏无匹配提示
            if (visibleCount === 0) {
                noResults.style.display = 'block';
                setTimeout(() => {
                    noResults.classList.add('visible');
                }, 10);
            } else {
                noResults.classList.remove('visible');
                setTimeout(() => {
                    noResults.style.display = 'none';
                }, 300);
            }
        }

        // 打开模态窗 - 带扩散动效
        function openModalWithSpread(event, photographerId, work) {
            if (isAnimating) return;
            isAnimating = true;

            const photographer = photographers.find(p => p.id === photographerId);
            if (!photographer) return;

            currentPhotographerId = photographerId;

            // 获取点击的卡片位置
            const card = event.currentTarget;
            const rect = card.getBoundingClientRect();
            
            // 创建扩散元素
            spreadElement = document.createElement('div');
            spreadElement.className = 'spread-element';
            spreadElement.style.cssText = `
                position: fixed;
                top: ${rect.top}px;
                left: ${rect.left}px;
                width: ${rect.width}px;
                height: ${rect.height}px;
                z-index: 1002;
                border-radius: 12px;
                overflow: hidden;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
                transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            `;
            
            // 创建图片元素
            const img = document.createElement('img');
            img.src = work.image;
            img.style.cssText = `
                width: 100%;
                height: 100%;
                object-fit: cover;
            `;
            spreadElement.appendChild(img);
            document.body.appendChild(spreadElement);

            // 开始扩散动画
            setTimeout(() => {
                spreadElement.style.cssText = `
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100vw;
                    height: 100vh;
                    z-index: 1002;
                    border-radius: 0;
                    overflow: hidden;
                    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
                    transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
                `;
            }, 50);

            // 扩散完成后显示模态窗
            setTimeout(() => {
                modal.classList.add('active');
                
                // 设置模态窗内容
                modalAvatar.src = photographer.avatar;
                modalAvatar.alt = photographer.name;
                modalName.textContent = photographer.name;
                modalBio.textContent = photographer.bio;
                modalPhilosophy.textContent = photographer.philosophy;

                // 渲染该摄影师的其他作品
                const photographerWorks = works.filter(w => w.photographerId === photographerId);
                otherWorksGrid.innerHTML = '';

                photographerWorks.forEach(work => {
                    const item = document.createElement('div');
                    item.className = 'other-work-item';
                    item.innerHTML = `
                        <img class="other-work-image" src="${work.image}" alt="${work.title}" loading="lazy">
                        <div class="other-work-overlay">
                            <span class="other-work-title">${work.title}</span>
                        </div>
                    `;
                    otherWorksGrid.appendChild(item);
                });

                // 添加滑动进入动画
                modalContent.classList.add('slide-in');
                
                document.body.style.overflow = 'hidden';
                isAnimating = false;
            }, 800);
        }

        // 关闭模态窗 - 带滑动退出效果
        function closeModal() {
            if (isAnimating) return;
            isAnimating = true;

            // 添加滑动退出动画
            modalContent.classList.add('slide-out');
            
            setTimeout(() => {
                modal.classList.remove('active');
                modalContent.classList.remove('slide-in', 'slide-out');
                
                // 移除扩散元素
                if (spreadElement) {
                    spreadElement.remove();
                    spreadElement = null;
                }
                
                document.body.style.overflow = '';
                currentPhotographerId = null;
                isAnimating = false;
            }, 600);
        }

        // ==================== 事件监听 ====================

        // 风格标签点击
        styleFilter.addEventListener('click', (e) => {
            if (e.target.classList.contains('style-tag')) {
                // 更新活跃状态
                document.querySelectorAll('.style-tag').forEach(tag => {
                    tag.classList.remove('active');
                });
                e.target.classList.add('active');

                // 筛选作品
                filterWorks(e.target.dataset.style);
            }
        });

        // 关闭模态窗
        modalClose.addEventListener('click', closeModal);
        modalBackdrop.addEventListener('click', closeModal);

        // ESC键关闭模态窗
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) {
                closeModal();
            }
        });

        // 导航栏滚动效果
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        // ==================== 滚动动画 ====================
        
        // Intersection Observer
        function observeElements() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, {
                threshold: 0.1,
                rootMargin: '0px 0px -50px 0px'
            });

            // 观察所有需要动画的元素
            document.querySelectorAll('.scroll-reveal').forEach(el => {
                observer.observe(el);
            });
        }

        // ==================== 初始化执行 ====================
        
        // 渲染作品
        renderWorks();

        // 初始滚动动画
        observeElements();

        // 页面加载动画
        document.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('page-loading');
        });
    </script>
</body>
</html>
